name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Bootstrap reproducible dependency lockfile
        run: |
          echo "BEGIN_PNPM_LOCKFILE"
          base64 -w0 pnpm-lock.yaml
          echo
          echo "END_PNPM_LOCKFILE"
      - name: Typecheck, unit tests and Worker bundle
        run: pnpm check
      - name: Local D1 integration smoke test
        run: |
          cp apps/worker/.dev.vars.example apps/worker/.dev.vars
          pnpm --filter @allenlabs/chat-worker db:local
          (cd apps/worker && pnpm exec wrangler dev --ip 127.0.0.1 --port 8799) > /tmp/chat-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          if ! node scripts/smoke.mjs; then
            cat /tmp/chat-worker.log
            exit 1
          fi
